<style>
:root{--bg:#eef3ef;--surface:#fff;--ink:#14231a;--muted:#5d6e63;--line:#dbe4de;--g1:#1f8f3f;--g2:#0e5c2b;--green:#177a36;--gold:#d99a1e;--ok:#1b8a3c;--ok-soft:#e2f4e7;--no:#d03a2f;--no-soft:#fde8e6;--blue:#2563eb;--blue-soft:#e6eefe;--tile:#e8f3eb;--shadow:0 6px 18px rgba(14,60,30,.10);--bar:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1711;--surface:#15241b;--ink:#e6efe9;--muted:#9bb0a3;--line:#294034;--g1:#1d7a39;--g2:#0b4a23;--green:#7fd09a;--gold:#e0b04c;--ok:#6fd08c;--ok-soft:#173424;--no:#ff8f86;--no-soft:#3a1f1d;--blue:#8fb2ff;--blue-soft:#1b2a4a;--tile:#1d3327;--shadow:0 6px 18px rgba(0,0,0,.35);--bar:#13221a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Noto Sans Bengali","Kohinoor Bangla",system-ui,sans-serif}
.bn{font-family:"Noto Sans Bengali","Kohinoor Bangla",Inter,sans-serif}
button{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:30;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));overflow:hidden;border-radius:0 0 26px 26px}
.hdr:after{content:"";position:absolute;right:-40px;top:-30px;width:170px;height:200px;background:linear-gradient(115deg,rgba(255,255,255,.22) 0 45%,rgba(220,60,60,.28) 45% 100%);transform:skewX(-18deg);pointer-events:none}
.hr{position:relative;z-index:1;display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto}
.hr h1{flex:1;margin:0;text-align:center;font:800 20px/1.2 Inter,sans-serif;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr.home h1{text-align:left}
.ib{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hsub{position:relative;z-index:1;max-width:860px;margin:2px auto 0;font-size:13.5px;opacity:.92}
.stopb{background:#d03a2f!important}
main{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#app{zoom:var(--z,1)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.tabs>div{display:flex;width:100%;max-width:520px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px Inter;color:var(--muted);padding:4px;cursor:pointer}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green)}
.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:22px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--shadow);cursor:pointer}
.big .art{flex:none;width:96px;height:96px}
.big b{display:block;font:800 24px/1.1 Inter}.big span{color:var(--muted);font-size:14px}
.big .go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-weight:800}
.prog{background:var(--ok-soft);border-radius:16px;padding:12px 14px}
.prog .t{display:flex;justify-content:space-between;font-weight:700;color:var(--ink)}
.bar{height:11px;border-radius:99px;background:rgba(0,0,0,.10);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g1);border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;width:100%}
.card .n{flex:none;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;font:800 17px Inter}
.card .t{min-width:0;flex:1}.card .t b{display:block;font-size:15px;line-height:1.25}.card .t span{font-size:12.5px;color:var(--muted)}
.card .p{flex:none;font:700 12px Inter;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:3px 9px}
h2.s{font:800 13px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:22px 2px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.s .push{margin-left:auto}
.pill{border:0;border-radius:99px;background:var(--g1);color:#fff;padding:9px 16px;font:700 13.5px Inter;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.pill.sm{padding:6px 12px;font-size:12.5px}
.pill svg{width:14px;height:14px;fill:currentColor}
.pill.cta{width:100%;justify-content:center;padding:14px;font-size:16px;border-radius:16px}
.pill:disabled{opacity:.4;cursor:not-allowed}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:700 13px Inter;cursor:pointer}
.chip.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.crumb{background:var(--surface);border-radius:99px;padding:7px 14px;text-align:center;font-weight:600;font-size:14px;box-shadow:var(--shadow);margin:0 auto 12px;width:fit-content;max-width:100%}
.ctitle{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.ctitle h2{margin:0;font:800 26px/1.15 Inter;color:var(--ink)}.ctitle .b{font-size:19px;font-weight:600;color:var(--green)}
.box{background:var(--surface);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.box h4{margin:0 0 6px;font:800 13px Inter;color:var(--green)}
.li{display:flex;gap:10px;align-items:flex-start;padding:3px 0}.li .t{flex:1;min-width:0}
.spk{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--g1);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.spk svg{width:17px;height:17px;fill:currentColor;pointer-events:none}
.spk.sm{width:28px;height:28px}.spk.sm svg{width:14px;height:14px}
.spk.b{background:transparent;color:var(--green);border:2px solid var(--green)}
.spk.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 45%,transparent)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vt{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.vr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}.vr:first-child{border-top:0}
.vr .a{font-weight:800;color:var(--green);font-size:16px}.vr .p{color:var(--muted);font-size:13.5px;font-weight:400}
.vr .m{font-size:15px}.vr .x{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:6px}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tile);color:var(--green);display:grid;place-items:center}
.ic svg{width:26px;height:26px}.ic.sm{width:30px;height:30px;border-radius:9px}.ic.sm svg{width:20px;height:20px}
.ic.spin svg{animation:spin 6s linear infinite}.ic.spinf svg{animation:spin 1.8s linear infinite}.ic.bob svg{animation:bob 2.2s ease-in-out infinite}.ic.blink svg{animation:blink 1.6s ease-in-out infinite}.ic.pulse2 svg{animation:pz 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes blink{50%{opacity:.35}}@keyframes pz{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.ic svg,.spk.on{animation:none!important}}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:6px 0}
.fb{flex:1 1 120px;min-width:0;border-radius:12px;padding:8px 10px;color:#14231a;font-size:14px}.fb b{display:block;color:#0e5c2b;font:800 12.5px Inter;margin-bottom:3px}
.ar{align-self:center;color:var(--gold);font-weight:800}
.note{font-size:13.5px;color:var(--muted);margin:2px 0 10px}
.q{background:var(--surface);border-radius:18px;margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:90px}
.q.playing{outline:3px solid var(--gold)}
.qh{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.tag{font:800 12.5px Inter;border-radius:99px;padding:5px 12px;background:var(--ok-soft);color:var(--ok);letter-spacing:.02em}
.tag.o{background:#fff1d6;color:#b06a00;margin-left:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.o{background:#3a2e12;color:#f0c060}}
.stem{padding:8px 14px 6px;font:800 19px/1.3 Inter}
.srow{display:flex;gap:10px;align-items:center;margin:8px 12px;padding:10px;border-radius:14px;background:var(--bg)}
.lt{flex:none;width:30px;height:30px;border-radius:50%;background:#fde3e0;color:var(--no);display:grid;place-items:center;font:800 14px Inter}
.srow.v .lt{background:#d9f1e0;color:var(--ok)}
.srow .tx{flex:1;min-width:0;font-size:15.5px}
.ans{flex:none;font:800 12.5px Inter;border-radius:99px;padding:5px 11px;border:2px solid}
.ans.v{border-color:var(--ok);color:var(--ok)}.ans.f{border-color:var(--no);color:var(--no)}
.bnx{display:none}.q.open .bnx,body.bnall .bnx{display:block}
.bnt{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.65}
.expb{background:var(--blue-soft);border-radius:10px;padding:7px 9px;margin-top:6px;font-size:14px;color:var(--ink)}
.words{padding:4px 14px 8px}
.words h4{margin:6px 0;font:800 11.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wg{display:flex;flex-wrap:wrap;gap:8px}
.w{display:flex;gap:7px;align-items:center;background:var(--bg);border-radius:12px;padding:5px 8px 5px 5px;font-size:14px}
.w .a{font-weight:800;color:var(--green)}.w .m{color:var(--muted);font-size:13px}
.tip{margin:6px 12px;padding:9px 11px;border-radius:12px;background:#fff7e0;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip{background:#2d2a14}}
.qf{display:flex;gap:8px;padding:6px 12px 12px;flex-wrap:wrap}
.audbar{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:16px;padding:10px 12px;margin:6px 12px 10px}
.audbar b{font-weight:700}.audbar .pl{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.audbar .pl svg{width:20px;height:20px;fill:var(--ink)}
/* practice */
.pq{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.pq .qh{padding:0 0 8px}
.pq .stem{padding:4px 0 10px;font-size:20px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:12px;margin:10px 0 0;cursor:pointer;user-select:none}
.opt .lt{background:#fde3e0;color:var(--no)}
.opt .tx{flex:1;min-width:0;font-size:16px;font-weight:500}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}.opt.sel .lt{background:var(--blue);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}.opt.wrong .lt{background:var(--no);color:#fff}
.opt.locked{cursor:default}
.fbk{margin-top:12px;border-radius:14px;padding:11px 13px;font-size:15px}
.fbk.ok{background:var(--ok-soft);border-left:6px solid var(--ok)}.fbk.no{background:var(--no-soft);border-left:6px solid var(--no)}
.fbk b.k{display:block;margin-bottom:3px;font-size:16px}
.res{text-align:center;padding:10px 0}
.res .big2{font:800 28px Inter}.res .ok{color:var(--ok)}.res .no{color:var(--no)}
.rrow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line);font-size:14.5px}
.rrow:first-child{border-top:0}.rrow .m{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.rrow .m.ok{background:var(--ok)}.rrow .m.no{background:var(--no)}
.tm{font:800 18px Inter;font-variant-numeric:tabular-nums}
.pr-nav{display:flex;gap:10px;margin-top:14px;position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:8px 0;background:linear-gradient(to top,var(--surface) 70%,transparent);z-index:5}.pr-nav .pill{flex:1;justify-content:center;padding:14px;font-size:15.5px;border-radius:16px}
.pbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:700;font-size:13.5px}.pbar .bar{flex:1;margin:0}
/* table (trucchi) */
table.t{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
table.t th{background:var(--g2);color:#fff;text-align:left;padding:7px 9px;font:700 12.5px Inter}
table.t td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:middle}table.t td.n{white-space:nowrap}
.sc{overflow-x:auto}
.red{color:var(--no);font-weight:800}.grn{color:var(--ok);font-weight:800}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:20px;padding:18px;margin:6px 0 12px}.hero .e{font:800 11px Inter;letter-spacing:.14em;color:#ffd98a;text-transform:uppercase}.hero h2{font:800 24px/1.2 Inter;margin:6px 0}.hero p{margin:0;opacity:.92}
@media (max-width:560px){.cs{grid-template-columns:1fr}.vr{grid-template-columns:40px minmax(0,1fr)}.vr .btns{grid-column:2}}
/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h3{margin:0 0 4px;font:800 20px Inter}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.sw b{font:800 17px Inter;display:block}.sw span{font-size:13px;color:var(--muted)}
.tg{flex:none;width:52px;height:30px;border-radius:99px;background:#b8c4bc;border:0;position:relative;cursor:pointer;padding:0}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--g1)}.tg.on:after{left:25px}
.demo{background:var(--ok-soft);border-radius:12px;padding:9px 12px;font-size:15px}
.fs{display:flex;gap:8px;margin-top:8px}.fs button{flex:1;border:0;border-radius:99px;background:var(--bg);padding:10px;font-weight:800;cursor:pointer}.fs button.on{background:var(--g1);color:#fff}

 let h='<div class="cards"><button class="card" data-go="esame"><span class="n">★</span><span class="t"><b>Esame simulato</b><span class="bn">২০টি মিশ্র প্রশ্ন · ৩০ মিনিট</span></span></button><button class="card" data-go="errori"><span class="n">!</span><span class="t"><b>Ripasso errori</b><span class="bn">ভুল করা '+wrong+'টি প্রশ্ন আবার</span></span></button></div>';
 h+='<div class="note bn" style="margin-top:12px">প্রতিটি সেটে ২০টি করে প্রশ্ন। উত্তর আগে দেখাবে না। প্রতিটি প্রশ্নে ৩টি বক্তব্যের মধ্যে যেটি সত্য (VERO), সেটি বাছুন।</div>';
 h+=D.map(c=>'<div class="box"><div style="display:flex;gap:10px;align-items:center"><span class="card" style="width:auto;box-shadow:none;padding:0;background:none"><span class="n">'+c.num+'</span></span><div style="flex:1;min-width:0"><b>'+esc(c.it)+'</b><div class="note bn" style="margin:0">'+esc(c.bn)+' · '+c.questions.length+' প্রশ্ন · করা '+chProg(c)+'</div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">'+setsOf(c).map((s,i)=>{const b=best[c.num+'-'+(i+1)];return '<button class="chip'+(b?' done':'')+'" data-go="r'+c.num+'-'+(i+1)+'">Set '+(i+1)+' · Q'+(s[0]+1)+'-'+s[1]+(b?' · '+b:'')+'</button>'}).join('')+'</div></div>').join('');
 app.innerHTML=h;window.scrollTo(0,0)}
function startPractice(items,meta){stopAll();clearInterval(examTimer);PR={items,i:0,sel:null,checked:false,res:[],meta,bn:false};renderPR()}
function runSet(cn,s){const c=D.find(x=>x.num===cn);if(!c)return home();const st=setsOf(c)[s-1];if(!st)return practiceHome();
 startPractice(c.questions.slice(st[0],st[1]).map(q=>({q,cn})),{title:'Capitolo '+cn+' · Set '+s,back:'practice',set:cn+'-'+s,next:(s<setsOf(c).length?'r'+cn+'-'+(s+1):(cn<14?'r'+(cn+1)+'-1':'practice'))})}
function errori(){const m=ansMap(),items=[];D.forEach(c=>c.questions.forEach(q=>{const a=m[c.num+'-'+q.n];if(a&&!a[1])items.push({q,cn:c.num})}));
 if(!items.length){chrome('Ripasso errori',{back:1,tab:'practice'});app.innerHTML='<div class="box bn">এখনও কোনো ভুল উত্তর নেই। আগে Practice করুন।</div>';return}
 startPractice(items.slice(0,30),{title:'Ripasso errori',back:'practice',next:'practice'})}
function exam(){const all=[];D.forEach(c=>c.questions.forEach(q=>all.push({q,cn:c.num})));for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
 startPractice(all.slice(0,20),{title:'Esame simulato',back:'practice',exam:true,next:'esame'});
 let left=1800;clearInterval(examTimer);examTimer=setInterval(()=>{const e=$('#tm');if(!e){clearInterval(examTimer);return}left--;const m=Math.floor(left/60),s=left%60;e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(examTimer);e.classList.add('no')}},1000)}
function renderPR(mode){const P=PR;const y0=window.scrollY;if(P.i>=P.items.length)return renderResult();
 const it=P.items[P.i],q=it.q;chrome(P.meta.title,{back:1,tab:'practice'});
 const pct=Math.round(100*P.i/P.items.length);const showBn=P.bn||S.bnall;const ci=q.st.findIndex(s=>s.v);
 let h='<div class="pbar"><span>'+(P.i+1)+' / '+P.items.length+'</span><div class="bar"><i style="width:'+pct+'%"></i></div>'+(P.meta.exam?'<span class="tm" id="tm">30:00</span>':'')+'</div>';
 h+='<div class="pq"><div class="qh"><span class="tag">QUESTION '+String(q.n).padStart(3,'0')+'</span><span class="tag o">VERO / FALSO</span></div><div class="stem"><div class="li">'+sp(q.si,'it','sm')+'<div class="t">'+esc(q.si)+'</div></div>'+(showBn?'<div class="bn" style="font-size:16px;font-weight:600;color:var(--green)">'+esc(q.sb)+'</div>':'')+'</div>';
 h+=q.st.map((s,k)=>{let cls='';if(P.checked){if(k===ci)cls=' right';else if(k===P.sel)cls=' wrong';cls+=' locked'}else if(P.sel===k)cls=' sel';
  return '<div class="opt'+cls+'" data-k="'+k+'" role="button" tabindex="0"><span class="lt">'+'ABC'[k]+'</span><div class="tx"><div>'+esc(s.it)+'</div>'+(showBn?'<div class="bn bnt">'+esc(s.bn)+'</div>':'')+'</div>'+sp(s.it,'it','sm')+'</div>'}).join('');
 if(P.checked){const ok=P.sel===ci;h+='<div class="fbk bn '+(ok?'ok':'no')+'"><b class="k">'+(ok?'✓ সঠিক উত্তর!':'✗ ভুল। সঠিক উত্তর: '+'ABC'[ci])+'</b><b>Spiegazione:</b> '+esc(q.st[ci].ex)+(ok?'':'<br><br><b>আপনার বাছা '+'ABC'[P.sel]+' কেন ভুল:</b> '+esc(q.st[P.sel].ex))+'</div>'}
 h+='<div class="pr-nav">'+(P.checked?'<button class="pill" id="nxt">'+(P.i+1<P.items.length?'Avanti ▶':'Risultato ▶')+'</button>':'<button class="pill ghost" id="bnb">'+(showBn?'বাংলা লুকান':'বাংলা অর্থ')+'</button><button class="pill" id="chk"'+(P.sel===null?' disabled':'')+'>Controlla Risposte</button>')+'</div></div>';
 app.innerHTML=h;if(mode==='keep')window.scrollTo(0,y0);else window.scrollTo(0,0)}
function renderResult(){const P=PR;clearInterval(examTimer);chrome('Risultato',{back:1,tab:'practice'});const n=P.items.length,right=P.res.filter(r=>r.ok).length;
 if(P.meta.set){const b=jget('cap_best',{});const old=b[P.meta.set];const nv=right+'/'+n;if(!old||+old.split('/')[0]<right)b[P.meta.set]=nv;lsSet('cap_best',JSON.stringify(b))}
 const pass=P.meta.exam?(n-right)<=2:right>=n-2;
 let h='<div class="pq res"><div class="big2 '+(pass?'ok':'no')+'">'+(pass?'✓':'✗')+' '+right+' / '+n+' Corrette</div>'+(P.meta.exam?'<div class="big2 '+(pass?'ok':'no')+'" style="font-size:20px">'+(pass?'Promosso':'Bocciato')+' · ভুল '+(n-right)+'</div>':'')+'<div class="bar"><i style="width:'+Math.round(100*right/n)+'%"></i></div></div>';
 h+='<div class="box">'+P.res.map((r,i)=>'<div class="rrow"><span class="m '+(r.ok?'ok':'no')+'">'+(r.ok?'✓':'✗')+'</span><div style="flex:1;min-width:0">Q'+String(r.q.n).padStart(3,'0')+' · '+esc(r.q.si)+'<div class="note" style="margin:0">Il tuo: '+'ABC'[r.sel]+' → Corretto: <b>'+'ABC'[r.ci]+'</b></div></div></div>').join('')+'</div>';
 h+='<div class="pr-nav"><button class="pill ghost" data-retry="1">↻ Riprova</button><button class="pill" data-go="'+P.meta.next+'">Avanti ▶</button></div>';
 app.innerHTML=h;window.scrollTo(0,0)}
function onPR(e){
 if(!PR)return;
 const o=e.target.closest('.opt');
 if(o&&!e.target.closest('.spk')){if(PR.checked)return;PR.sel=+o.dataset.k;document.querySelectorAll('.pq .opt').forEach(x=>x.classList.toggle('sel',+x.dataset.k===PR.sel));const cb=$('#chk');if(cb)cb.disabled=false;return}
 if(e.target.closest('#chk')){const it=PR.items[PR.i],q=it.q,ci=q.st.findIndex(s=>s.v),ok=PR.sel===ci;PR.checked=true;PR.res.push({q,sel:PR.sel,ci,ok});
  const m=ansMap();m[it.cn+'-'+q.n]=[PR.sel,ok?1:0];lsSet('cap_ans',JSON.stringify(m));renderPR('keep');const fb=document.querySelector('.fbk');if(fb)fb.scrollIntoView({block:'center',behavior:'smooth'});return}
 if(e.target.closest('#nxt')){PR.i++;PR.sel=null;PR.checked=false;PR.bn=false;renderPR('top');return}
 if(e.target.closest('#bnb')){PR.bn=!PR.bn;renderPR('keep');return}
}

 app.innerHTML='<div class="note bn">কোনো অধ্যায়ে চাপ দিলে পুরো অধ্যায় পরপর শোনাবে (প্রশ্ন, উত্তর ও ব্যাখ্যা)। বাংলাসহ শুনতে Settings-এ Audio সুইচ চালু রাখুন। থামাতে ওপরের লাল ■ বোতাম।</div><div class="cards">'+D.map(c=>'<button class="card" data-listen="'+c.num+'"><span class="n">'+c.num+'</span><span class="t"><b>'+esc(c.it)+'</b><span class="bn">'+esc(c.bn)+'</span></span><span class="p">▶</span></button>').join('')+'</div>';window.scrollTo(0,0)}
function infoTab(){stopAll();chrome('Info',{back:1,tab:'info'});
 app.innerHTML='<div class="box bn"><h4>পরীক্ষার কাঠামো</h4><div>MIT-এর বর্ণনা অনুযায়ী CAP পরীক্ষায় ২০টি প্রশ্ন, ৩০ মিনিট সময়, সর্বোচ্চ ২টি ভুল চলে। প্রতিটি প্রশ্নে ৩টি বক্তব্য থাকে, তার ঠিক একটি সত্য (VERO)।</div></div><div class="box bn"><h4>বই সম্পর্কে</h4><div>৫১৪টি প্রশ্ন, ১৪টি অধ্যায়। লেখক: MD RIFAT AHMED। প্রশ্নের উৎস: patentefacile.net-এ প্রকাশিত listato (১৩/০২/২০২৪), যা তৃতীয় পক্ষের সাইট; MIT-এর মূল ফাইলের সাথে মেলানো হয়নি। পরীক্ষার আগে বাস্তব নিয়ম ও তারিখ Motorizzazione Civile ও ilportaledellautomobilista.it থেকে মিলিয়ে নিন।</div></div><div class="box bn"><h4>আওয়াজ না এলে</h4><div>• ফোনের সাইলেন্ট সুইচ বন্ধ করুন ও ভলিউম বাড়ান। • iPhone: Settings > Accessibility > Read &amp; Speak > Voices থেকে Italian ও Bengali ডাউনলোড করুন। • Android: Text-to-speech সেটিংসে একই।</div></div><button class="big" data-go="trucchi" style="margin-top:10px"><div><b style="font-size:20px">Trucchi</b><span class="bn">পরীক্ষার কৌশল ও শব্দ-সংকেত</span></div><span class="go">➜</span></button>';window.scrollTo(0,0)}

/* ---------- router ---------- */
function route(){const h=location.hash.slice(1);$('#ov').hidden=true;clearInterval(examTimer);PR=null;
 let m;
 if(h==='')return home();if(h==='ebook')return ebook();if(h==='practice')return practiceHome();if(h==='esame')return exam();if(h==='errori')return errori();
 if(h==='audio')return audioTab();if(h==='info')return infoTab();if(h==='trucchi')return trucchi();
 if(m=/^c(\d+)$/.exec(h)){const a=pendingPlay===+m[1];pendingPlay=null;return chapter(+m[1],a)}
 if(m=/^r(\d+)-(\d+)$/.exec(h))return runSet(+m[1],+m[2]);
 home()}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();const t=g.dataset.go;if(location.hash.slice(1)===t)route();else location.hash=t;return}
 if(e.target.closest('[data-back]')){if(PR&&PR.i>0&&PR.i<PR.items.length&&!confirmBack()){return}history.length>1?history.back():(location.hash='');return}
 if(e.target.closest('[data-sheet]')){openSettings();return}
 const l=e.target.closest('[data-listen]');if(l){pendingPlay=+l.dataset.listen;location.hash='c'+l.dataset.listen;return}
 if(e.target.closest('[data-retry]')){const m=PR.meta,its=PR.items;if(m.exam)return exam();startPractice(its,m);return}
 if(e.target.id==='closeov'||e.target.id==='ov'){$('#ov').hidden=true;return}
 if(e.target.id==='t_bn'){S.bnall=!S.bnall;lsSet('s_bnall',S.bnall?'1':'0');applySettings();openSettings();return}
 if(e.target.id==='t_inc'){S.inc=!S.inc;lsSet('s_inc',S.inc?'1':'0');openSettings();return}
 const f=e.target.closest('[data-fs]');if(f){S.fs=+f.dataset.fs;lsSet('s_fs',S.fs);applySettings();openSettings();return}
 const s=e.target.closest('.spk');if(s){speakBtn(s);return}
 const b=e.target.closest('[data-bn]');if(b){document.getElementById('q-'+b.dataset.bn).classList.toggle('open');return}
 const p=e.target.closest('[data-playq]');if(p){const[cn,n]=p.dataset.playq.split('-').map(Number);const c=D.find(x=>x.num===cn),card=document.getElementById('q-'+p.dataset.playq);playSeq(qItems(c.questions[n-1],cn,S.bnall||card.classList.contains('open')),onItem);return}
 onPR(e);
});
document.addEventListener('input',e=>{if(e.target.id==='rate'){lsSet('rate',e.target.value);$('#rv').textContent=(+e.target.value).toFixed(2)}});
document.addEventListener('change',e=>{if(e.target.id==='vit')lsSet('voice_it',e.target.value);if(e.target.id==='vbn')lsSet('voice_bn',e.target.value)});
function confirmBack(){return true}
route();
